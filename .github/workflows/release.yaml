name: Release

# Builds and publishes every KERNEXT artifact for one version:
#
#   - the Rust CLI (`kernext` and `kernext-server`) as per-platform archives
#   - the Tauri 2 desktop application as per-platform installers
#   - a SHA-256 checksum beside every published file
#
# Triggers
#   - pushing a version tag such as `v0.1.0`
#   - a manual dispatch against an existing tag
#
# `ci.yml` is the pull-request pipeline; this workflow is the only one that
# publishes. A failed platform build fails its matrix job, which skips the
# `release` job entirely: an incomplete release is never published. No step
# may use `continue-on-error`.
#
# Signing is optional. Without the signing secrets the bundles are produced
# unsigned, which is a working build that the operating system may warn about
# on first launch. No secret is required to build.
#
# Package manager: pnpm exclusively (`pnpm-lock.yaml`). See docs/RELEASING.md.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish (for example v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PNPM_VERSION: '12.18.0'

jobs:
  verify:
    name: Verify workspace
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        # `cargo test --workspace` compiles the Tauri desktop crate on Linux.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libdbus-1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Cache cargo target
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/cargo-target
          key: ${{ runner.os }}-release-verify-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-verify-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the release tag matches every manifest
        run: node scripts/check-release-version.mjs "${{ github.event.inputs.tag || github.ref_name }}"

      - name: Format check
        run: cargo fmt --all -- --check
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target

      - name: Rust tests
        run: cargo test --workspace
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target

      - name: Web typecheck
        run: pnpm run typecheck

      - name: Web tests
        run: pnpm test

      - name: Web build
        run: pnpm run build

  cli:
    name: CLI ${{ matrix.name }}
    needs: verify
    strategy:
      # Every platform runs even when one fails, so the log names the real
      # cause; the release job still requires all of them to succeed.
      fail-fast: false
      matrix:
        include:
          # The Windows archive ships the GNU build, which is the toolchain the
          # project's Windows test suite runs on and links without an external
          # MinGW installation.
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-gnu
            artifact: cli-windows-x86_64
          - name: Linux x64 (glibc)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: cli-linux-x86_64
          - name: Linux x64 (musl)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            artifact: cli-linux-x86_64-musl
          - name: Linux arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: cli-linux-aarch64
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: cli-macos-aarch64
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: cli-macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo target
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/cargo-target
          key: ${{ runner.os }}-release-cli-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-cli-${{ matrix.target }}-

      - name: Build release binaries
        run: cargo build --release --locked --target ${{ matrix.target }} -p shell-cli -p shell-server
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          # The extensionless Unix names and the Windows `.exe` names are both
          # listed; only the ones that exist on this runner are uploaded.
          path: |
            ${{ runner.temp }}/cargo-target/${{ matrix.target }}/release/kernext
            ${{ runner.temp }}/cargo-target/${{ matrix.target }}/release/kernext-server
            ${{ runner.temp }}/cargo-target/${{ matrix.target }}/release/kernext.exe
            ${{ runner.temp }}/cargo-target/${{ matrix.target }}/release/kernext-server.exe
          if-no-files-found: error
          retention-days: 14

  desktop:
    name: Desktop ${{ matrix.name }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            platform: windows
            arch: x64
            bundles: msi,nsis
            target: ''
          - name: Linux x64
            os: ubuntu-22.04
            platform: linux
            arch: x64
            bundles: appimage,deb,rpm
            target: ''
          # GitHub's Arm64 runner. The arm64 installer legs are newer than the
          # x64 ones; docs/PROJECT_STATUS.md records that they are unverified
          # locally.
          - name: Linux arm64
            os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            bundles: appimage,deb,rpm
            target: ''
          - name: macOS Apple Silicon
            os: macos-latest
            platform: macos
            arch: arm64
            bundles: dmg
            target: aarch64-apple-darwin
          - name: macOS Intel
            os: macos-15-intel
            platform: macos
            arch: x64
            bundles: dmg
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libdbus-1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Cache cargo target
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/cargo-target
          key: ${{ runner.os }}-release-desktop-${{ matrix.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-desktop-${{ matrix.arch }}-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop bundles
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
        run: |
          set -euo pipefail
          ARGS=(--bundles "${{ matrix.bundles }}")
          if [ -n "${{ matrix.target }}" ]; then
            ARGS+=(--target "${{ matrix.target }}")
          fi
          pnpm --filter @kernext/desktop run build -- "${ARGS[@]}"

      - name: Collect installers and checksums
        run: |
          node scripts/collect-bundles.mjs \
            --target "${{ runner.temp }}/cargo-target" \
            --out "${{ runner.temp }}/desktop-dist" \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}"

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/desktop-dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [verify, cli, desktop]
    # Runs for a version tag push or a manual dispatch. A failed platform build
    # fails its matrix job, which skips this job: no partial release is
    # published.
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download CLI binaries
        uses: actions/download-artifact@v7
        with:
          path: cli-artifacts
          pattern: cli-*

      - name: Download desktop installers
        uses: actions/download-artifact@v7
        with:
          path: desktop-artifacts
          pattern: desktop-*
          merge-multiple: true

      - name: Assemble release assets
        run: |
          set -euo pipefail
          mkdir -p release

          # CLI archives, one per Rust target triple.
          tar -czf release/kernext-x86_64-unknown-linux-gnu.tar.gz \
            -C cli-artifacts/cli-linux-x86_64 kernext kernext-server
          tar -czf release/kernext-x86_64-unknown-linux-musl.tar.gz \
            -C cli-artifacts/cli-linux-x86_64-musl kernext kernext-server
          tar -czf release/kernext-aarch64-unknown-linux-gnu.tar.gz \
            -C cli-artifacts/cli-linux-aarch64 kernext kernext-server
          tar -czf release/kernext-aarch64-apple-darwin.tar.gz \
            -C cli-artifacts/cli-macos-aarch64 kernext kernext-server
          tar -czf release/kernext-x86_64-apple-darwin.tar.gz \
            -C cli-artifacts/cli-macos-x86_64 kernext kernext-server
          (
            cd cli-artifacts/cli-windows-x86_64
            zip -j "$GITHUB_WORKSPACE/release/kernext-x86_64-pc-windows-gnu.zip" \
              kernext.exe kernext-server.exe
          )

          # Desktop installers already carry the canonical names and checksums
          # that `scripts/collect-bundles.mjs` gave them.
          cp desktop-artifacts/kernext-desktop-* release/

          # One SHA-256 per artifact. Regenerating the desktop checksums is
          # idempotent and keeps a single checksum convention for every file.
          cd release
          find . -maxdepth 1 -type f ! -name '*.sha256' ! -name '*.sig' -printf '%P\0' |
            while IFS= read -r -d '' file; do
              sha256sum "$file" > "$file.sha256"
            done

      - name: Verify checksums
        run: |
          set -euo pipefail
          cd release
          count=0
          for file in $(ls | grep -v '\.sha256$' | grep -v '\.sig$'); do
            sha256sum -c "$file.sha256"
            count=$((count + 1))
          done
          if [ "$count" -eq 0 ]; then
            echo "::error::No release assets were assembled."
            exit 1
          fi
          echo "Verified ${count} artifact(s)."

      - name: Write release notes
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          cat > release-notes.md <<EOF
          KERNEXT ${TAG} — the shell, the CLI, and the desktop application for
          every supported platform.

          ## Desktop application

          | Platform | Architecture | Format |
          | --- | --- | --- |
          | Windows 10/11 | x64 | \`.msi\` (MSI) and \`-setup.exe\` (NSIS) |
          | Linux | x64 | \`.AppImage\`, \`.deb\`, \`.rpm\` |
          | Linux | arm64 | \`.AppImage\`, \`.deb\`, \`.rpm\` |
          | macOS | Apple Silicon (arm64) | \`.dmg\` |
          | macOS | Intel (x64) | \`.dmg\` |

          ## Command-line shell

          | Platform | Architecture | Archive |
          | --- | --- | --- |
          | Windows | x64 | \`kernext-x86_64-pc-windows-gnu.zip\` |
          | Linux | x64 (glibc) | \`kernext-x86_64-unknown-linux-gnu.tar.gz\` |
          | Linux | x64 (musl) | \`kernext-x86_64-unknown-linux-musl.tar.gz\` |
          | Linux | arm64 | \`kernext-aarch64-unknown-linux-gnu.tar.gz\` |
          | macOS | Apple Silicon | \`kernext-aarch64-apple-darwin.tar.gz\` |
          | macOS | Intel | \`kernext-x86_64-apple-darwin.tar.gz\` |

          Every file has a matching \`.sha256\` checksum.

          ## Verify a download

          \`\`\`sh
          sha256sum -c kernext-desktop-linux-x64.AppImage.sha256
          \`\`\`

          \`\`\`powershell
          Get-FileHash .\kernext-desktop-windows-x64-setup.exe -Algorithm SHA256
          \`\`\`

          ## Install

          - **Windows**: run the \`.msi\` or the \`-setup.exe\`.
          - **Linux AppImage**: \`chmod +x kernext-desktop-linux-x64.AppImage\` then run it.
          - **Linux .deb**: \`sudo apt install ./kernext-desktop-linux-x64.deb\`.
          - **Linux .rpm**: \`sudo dnf install ./kernext-desktop-linux-x64.rpm\`.
          - **macOS**: open the \`.dmg\` and drag KERNEXT to Applications.

          ## Signing

          These builds are unsigned unless the release was produced with the
          optional signing secrets configured. Unsigned builds may trigger a
          SmartScreen, Gatekeeper, or package-manager warning on first launch.
          See \`docs/RELEASING.md\` for how to enable signing.
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release create "$TAG" release/* \
            --title "KERNEXT ${TAG}" \
            --notes-file release-notes.md \
            --latest
