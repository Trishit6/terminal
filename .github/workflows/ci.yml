name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# CARGO_TERM_COLOR is static and safe at this level. CARGO_TARGET_DIR
# cannot live here: the `runner` context is only available in step-level
# keys, so every step that invokes cargo declares it explicitly (to the same
# path the cache actions use). The override also matters because the tracked
# .cargo/config.toml pins a workstation-specific target directory that does
# not exist on hosted runners.
env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux system dependencies
        # The workspace includes the Tauri desktop crate, so even Clippy has
        # to build its system-library build scripts on Linux.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libdbus-1-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache cargo target
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/cargo-target
          key: ${{ runner.os }}-ci-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ci-lint-
      - name: Format check
        run: cargo fmt --all -- --check
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target

  web:
    name: Web typecheck, tests, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        # Version comes from the packageManager pin in package.json.
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build

  test:
    name: Test and release build (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        # Windows x64, Linux x64, macOS Apple Silicon (macos-latest), and
        # macOS Intel (macos-15-intel is the last x86_64 runner image).
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux system dependencies
        # cargo test --workspace compiles the Tauri desktop crate's tests, and
        # its system-library build scripts need the Linux dev packages.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libdbus-1-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo target
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/cargo-target
          key: ${{ runner.os }}-ci-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ci-
      - name: Tests
        run: cargo test --workspace
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
      - name: Release build
        run: cargo build --workspace --release
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target

  desktop:
    name: Desktop build (${{ matrix.os }})
    needs: [lint, web]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libdbus-1-dev
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo target
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/cargo-target
          key: ${{ runner.os }}-ci-desktop-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ci-desktop-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build desktop application
        # Compiles the desktop app in release mode with the embedded front
        # end (beforeBuildCommand runs the web build) but skips installer
        # bundling; the release workflow produces the installers.
        run: pnpm desktop:build --no-bundle
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
