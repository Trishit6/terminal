[package]
name = "shell-builtins"
description = "Built-in registry, AST evaluator, and external process execution for KERNEXT"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
chrono.workspace = true
shell-core.workspace = true
shell-runtime.workspace = true

# Platform bindings used by the pseudoterminal backends. The console execution
# path stays on `std::process`; these are only for ConPTY and `openpty`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
