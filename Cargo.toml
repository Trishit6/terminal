[workspace]
resolver = "3"
members = [
    "apps/shell-cli",
    "apps/shell-server",
    "apps/desktop/src-tauri",
    "crates/shell-builtins",
    "crates/shell-config",
    "crates/shell-core",
    "crates/shell-line-editor",
    "crates/shell-runtime",
    "crates/shell-api",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
axum = { version = "0.8", features = ["ws"] }
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
futures-util = "0.3"
reedline = "0.49"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

shell-builtins = { path = "crates/shell-builtins", version = "0.1.0" }
shell-config = { path = "crates/shell-config", version = "0.1.0" }
shell-core = { path = "crates/shell-core", version = "0.1.0" }
shell-line-editor = { path = "crates/shell-line-editor", version = "0.1.0" }
shell-runtime = { path = "crates/shell-runtime", version = "0.1.0" }
shell-api = { path = "crates/shell-api", version = "0.1.0" }