[workspace]
resolver = "3"
members = [
    "apps/shell-cli",
    "crates/shell-builtins",
    "crates/shell-config",
    "crates/shell-core",
    "crates/shell-line-editor",
    "crates/shell-runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
reedline = "0.49"
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"

shell-builtins = { path = "crates/shell-builtins", version = "0.1.0" }
shell-config = { path = "crates/shell-config", version = "0.1.0" }
shell-core = { path = "crates/shell-core", version = "0.1.0" }
shell-line-editor = { path = "crates/shell-line-editor", version = "0.1.0" }
shell-runtime = { path = "crates/shell-runtime", version = "0.1.0" }
